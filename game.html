 document.querySelectorAll('[data-skill]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.skill,opt=options.find(q=>q[0]===id);if(!opt||player.unlocks[id]||player.skillPoints<opt[3])return;player.skillPoints-=opt[3];player.unlocks[id]=true;player.ce=Math.max(player.ce,55);save();showSkills();setNotice(opt[1]+' unlocked!')});
}
function showRoster(){
 ui='roster';present('<div class="eyebrow">CHARACTER SELECT</div><h2>Choose Your Sorcerer</h2><p class="intro">Each sorcerer keeps an independent journey. Select another to start or continue their own lifetime.</p><div class="rows">'+Object.keys(PEOPLE).map(id=>'<button data-id="'+id+'" style="text-align:left;display:flex;justify-content:space-between;gap:20px"><strong>'+esc(personFor(id).name)+'</strong><span>'+esc(ARCS[id][profiles[id]?.chapter||0]?.era||'CHILDHOOD')+'</span></button>').join('')+'</div><div class="btnline"><button id="rosterReturn">BACK</button></div>');

}
const CHANGES=[['4.0.0','REFORGED ENGINE','Rebuilt game presentation and controls, authored mission loop, five distinct lifetime arcs, optional assignments, new skill progression, matching custom-character art, safer independent saves.'],['3.0.2','LEGACY ARCHIVE','Previous game retained in archive/veilbound-v3.0.2.html in GitHub.']];
function showUpdates(){present('<div class="eyebrow">PATCH NOTES</div><h2>Updates</h2>'+CHANGES.map(x=>'<div class="card"><div class="eyebrow">v'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'<button id="upBack">BACK</button>');$('upBack').onclick=showJournal}
function showPause(){ui='pause';present('<div class="eyebrow">VEILBOUND REFORGED</div><h1>PAUSED</h1><div class="btnline"><button class="primary" id="pauseResume">RESUME</button><button id="pauseJournal">JOURNAL</button><button id="pauseRoster">CHANGE SORCERER</button><button id="pauseTitle">TITLE</button></div>');$('pauseResume').onclick=hideModal;$('pauseJournal').onclick=showJournal;$('pauseRoster').onclick=showRoster;$('pauseTitle').onclick=()=>{save();renderTitle()}}
function interact(){if(!playing||paused)return;const q=world.task;if(mission===2||mission===3){for(let i=0;i<3;i++){const x=700+i*870,arr=mission===2?q.seals:q.clues;if(Math.abs(player.x-x)<90&&!arr[i]){if(nearby(x,250).length){setNotice('GUARDED · CLEAR ENEMIES FIRST');return}arr[i]=true;player.stats.cache++;player.sideStats.collect++;setNotice(mission===2?'SEAL PURIFIED':'EVIDENCE RECOVERED');checkMission();return}}}setNotice('Find the marked mission objective')}
function punch(){if(!playing||paused||player.attack>0||player.stamina<13)return;player.attack=.43;player.stamina-=13;player.combo=(player.combo||0)%3+1;for(const e of world.enemies){if(e.dead||Math.abs(e.x-player.x)>102||Math.abs(e.y-player.y)>110||(e.x-player.x)*player.face< -25)continue;damage(e,18+player.combo*5+(player.counter>0?28:0));if(mission===0){const q=world.task;q.hits++;if(player.counter>0)q.counters++;checkMission()}player.counter=0;break}}
function damage(e,n){if(e.dead)return;if(e.type==='boss'&&e.shield>0&&!e.broken){e.shield=Math.max(0,e.shield-n*.8);if(e.shield===0){e.broken=5;setNotice('SHIELD BROKEN · ATTACK!')}return}if(e.type==='dummy'){e.stun=.15;return}e.hp-=n;e.stun=e.type==='boss'?.08:.28;e.x=clamp(e.x+player.face*15,25,WIDTH-50);for(let i=0;i<9;i++)world.particles.push({x:e.x+16,y:e.y+18,vx:(Math.random()-.5)*210,vy:-Math.random()*200,t:.35,color:personFor(player.id).aura});if(e.type==='boss'&&player.id==='gojo'&&chapter===4&&e.hp<=e.max*.17){e.hp=0;e.dead=true;player.hp=0;setNotice('SUKUNA · THE FATAL REVERSAL');checkMission();return}if(e.hp<=0){e.dead=true;world.chapterKills++;player.stats.kills++;player.sideStats.kills++;player.xp+=30;if(e.type==='boss')setNotice('BOSS DEFEATED · '+e.name);checkMission()}}
function useSkill(){if(!playing||paused)return;if(!player.unlocks.technique){setNotice('Unlock technique in Skill Tree');return}if(player.ce<38||player.stamina<20){setNotice('Need 38 CE and 20 stamina');return}player.ce-=38;player.stamina-=20;let n=0;for(const e of [...world.enemies])if(!e.dead&&Math.abs(e.x-player.x)<205){damage(e,75+player.level*4);n++}setNotice(n?personFor(player.id).skill+' · '+n+' hits':'TECHNIQUE MISSED')}
function ultimate(){if(!playing||paused)return;if(!player.unlocks.ultimate||player.ce<90||player.stamina<40){setNotice('Ultimate needs skill unlock, 90 CE and 40 stamina');return}player.ce-=90;player.stamina-=40;for(const e of [...world.enemies])if(!e.dead&&Math.abs(e.x-player.x)<330)damage(e,170+player.level*10);setNotice(personFor(player.id).ultimate)}
function beginSlide(){if(!playing||paused||!player.grounded||player.slide>0||player.dash>0||player.stamina<20||Math.abs(player.vx||0)<110)return;player.stamina-=20;player.slide=.54;player.slideDir=Math.sign(player.vx)||player.face;player.vx=player.slideDir*530;player.crouch=true;for(let i=0;i<8;i++)world.particles.push({x:player.x,y:G-9,vx:(Math.random()-.5)*150,vy:-Math.random()*90,t:.3,color:'#aeb5c6'})}
function dash(){if(!playing||paused||player.slide>0||player.dash>0||player.stamina<23)return;player.stamina-=23;player.dash=.24;player.dashDir=player.face||1;player.vx=player.dashDir*780;player.counter=0}
function jump(){if(!playing||paused)return;if(player.grounded||player.jumps<(player.unlocks.airStep?2:1)){player.vy=-520;player.grounded=false;player.jumps=(player.jumps||0)+1}}
function keyDown(e){const k=e.key.toLowerCase();
 if(ui==='title'&&!['INPUT','SELECT'].includes(document.activeElement.tagName)){const ids=Object.keys(PEOPLE);if(k==='a'||k==='arrowleft'){selected=ids[(ids.indexOf(selected)+ids.length-1)%ids.length];renderTitle()}if(k==='d'||k==='arrowright'){selected=ids[(ids.indexOf(selected)+1)%ids.length];renderTitle()}if(k==='enter')begin(selected,false);return}
 if(!playing)return;
 if([' ','arrowup','arrowdown','tab'].includes(k))e.preventDefault();
 if(k==='escape'){if(paused)hideModal();else showPause();return}
 if(k==='tab'){if(!paused)showJournal();return}
 if(paused)return;keys[k]=true;
 if(!e.repeat){if(k===' '||k==='w'||k==='arrowup')jump();if(k==='shift')dash();if(k==='c'||k==='control'){if(Math.abs(player.vx||0)>110)beginSlide();else player.crouch=true}if(k==='q')guard();if(k==='j'||k==='z')punch();if(k==='k')useSkill();if(k==='l')ultimate();if(k==='e')interact()}
}
addEventListener('keydown',keyDown);addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if((e.key.toLowerCase()==='c'||e.key.toLowerCase()==='control')&&player)player.crouch=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
$('journalBtn').onclick=()=>showJournal();$('pauseBtn').onclick=()=>showPause();
document.querySelectorAll('[data-hold]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.hold]=true;if(b.dataset.hold==='j')punch()});for(const type of ['pointerup','pointercancel','pointerleave'])b.addEventListener(type,()=>keys[b.dataset.hold]=false)});
document.querySelectorAll('[data-press]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.press;if(a==='jump')jump();if(a==='dash')dash();if(a==='slide')beginSlide();if(a==='crouch')player.crouch=!player.crouch;if(a==='guard')guard();if(a==='skill')useSkill();if(a==='interact')interact()}));
function step(dt){
 if(!playing||paused)return;elapsed+=dt;player.stats.playSeconds+=dt;
 player.attack=Math.max(0,(player.attack||0)-dt);player.dash=Math.max(0,(player.dash||0)-dt);player.inv=Math.max(0,(player.inv||0)-dt);player.guard=Math.max(0,(player.guard||0)-dt);player.counter=Math.max(0,(player.counter||0)-dt);
 player.stamina=clamp((player.stamina??100)+17*dt,0,100);player.ce=clamp(player.ce+(player.unlocks.control?8:2)*dt,0,100);
 const dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(dir&&player.slide<=0&&player.dash<=0)player.face=dir;
 player.slide=Math.max(0,(player.slide||0)-dt);
 const low=!!(keys.c||keys.control||keys.arrowdown||keys.s||player.crouch);
 player.crouch=player.slide>0||low;
 const target=player.slide>0?player.slideDir*515:player.dash>0?(player.dashDir||player.face)*780:dir*(low?100:245);
 const response=player.slide>0?3:player.dash>0?35:dir?13:9;
 player.vx=(player.vx||0)+(target-(player.vx||0))*Math.min(1,dt*response);
 player.x=clamp(player.x+player.vx*dt,25,WIDTH-40);player.vy=(player.vy||0)+1250*dt;player.y+=player.vy*dt;
 if(player.y>=G-86){player.y=G-86;player.vy=0;player.grounded=true;player.jumps=0}
 cam+=(clamp(player.x-440,0,WIDTH-W)-cam)*Math.min(1,5*dt);
 const q=world.task;
 for(const e of world.enemies){
  if(e.dead)continue;e.stun=Math.max(0,e.stun-dt);e.attack-=dt;e.warning=Math.max(0,(e.warning||0)-dt);e.recover=Math.max(0,(e.recover||0)-dt);
  if(e.type==='boss'&&e.broken>0){e.broken=Math.max(0,e.broken-dt);if(e.broken===0)e.shield=e.maxShield*.6}
  if(e.stun>0||e.broken>0)continue;
  const target=mission===4?1900:mission===1&&q.civilian.active&&Math.abs(e.x-q.civilian.x)<180?q.civilian.x:player.x;
  const dist=Math.abs(e.x-target),reach=e.type==='boss'?165:e.type==='heavy'?110:85;
  if(e.windup){if(e.warning<=0){e.windup=false;e.attack=e.type==='boss'?1.6:1.25;e.recover=.4;
    if(Math.abs(e.x-player.x)<reach){
      if(player.dash>0){player.counter=1.4;setNotice('DODGED · COUNTER!')}
      else if(player.guard>0&&player.face===(e.x>player.x?1:-1)){q.guards++;player.counter=1.2;player.stamina=Math.max(0,player.stamina-9);setNotice('BLOCKED · COUNTER!')}
      else if(player.inv<=0){player.hp-=e.type==='boss'?32+chapter*4:e.type==='heavy'?20:12;player.inv=.7;setNotice('HIT · WATCH TELEGRAPH');if(player.hp<=0){q.failures++;player.hp=player.maxHp;setNotice('MISSION FAILED · RESTART');resetTask();break}}
    }
    if(mission===1&&q.civilian.active&&Math.abs(e.x-q.civilian.x)<reach)q.civilian.hp-=e.type==='heavy'?22:12;
    if(mission===4&&Math.abs(e.x-1900)<reach)q.barrier-=e.type==='heavy'?20:12;
   }continue}
  if(e.recover>0)continue;
  if(dist<reach+35&&e.attack<=0){e.windup=true;e.warning=e.type==='boss'?.95:.7}
  else if(dist<650||mission===4||mission===1&&q.civilian.active)e.x=clamp(e.x+Math.sign(target-e.x)*(e.kind?.speed||110)*dt,25,WIDTH-70);
 }
 if(mission===1){const n=q.civilian;if(!n.active&&Math.abs(player.x-n.x)<110){n.active=true;setNotice('ESCORT STARTED')}if(n.active){if(player.x>n.x+70&&player.x<n.x+480&&!nearby(n.x,110).length)n.x+=92*dt;if(n.hp<=0){q.failures++;n.x=240;n.hp=120;n.active=false;player.x=170;setNotice('CIVILIAN LOST · RESTART ESCORT')}if(n.x>=3100){advance();return}}}
 if(mission===4){q.time+=dt;q.waveClock-=dt;if(q.waveClock<=0){q.waveClock=Math.max(5,11-chapter);q.waves++;for(let i=0;i<3+Math.min(q.waves,3);i++)world.enemies.push(createFoe(870+i*150,i%2?'curse':'heavy'));setNotice('WAVE '+q.waves)}if(q.barrier<=0){q.failures++;q.time=0;q.barrier=250;q.waveClock=4;world.enemies=[];setNotice('BARRIER DESTROYED · RESTART')}if(q.time>=75){advance();return}}
 for(const t of world.particles){t.x+=t.vx*dt;t.y+=t.vy*dt;t.vy+=340*dt;t.t-=dt}world.particles=world.particles.filter(x=>x.t>0).slice(-400);
 notification=Math.max(0,notification-dt);if(notification===0)$('notice').classList.remove('on');updateHUD();
 if(Math.floor(player.stats.playSeconds)%20===0&&Math.floor(player.stats.playSeconds)!==(player.lastSaveTick||-1)){player.lastSaveTick=Math.floor(player.stats.playSeconds);save()}
}
function updateHUD(){
 if(!playing)return;const who=personFor(player.id),a=chapterData(),q=missionInfo();
 $('heroName').textContent=who.name+' · Lv '+player.level;$('chapterName').textContent=a.era+' · '+a.place;
 $('hpBar').style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';$('ceBar').style.width=player.ce+'%';
 $('vitals').textContent=Math.ceil(player.hp)+' HP · '+Math.floor(player.ce)+' CE · '+Math.floor(player.stamina??100)+' ST · '+player.skillPoints+' points · '+(player.fragments||0)+' fragments';
 $('questTitle').textContent=q[0];$('questDesc').textContent=q[1];$('questProgress').textContent=q[2]+' · MISSION '+(mission+1)+'/6';
}
function renderBackground(){
 const a=chapterData(),palette=a.palette,bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,palette[0]);bg.addColorStop(1,palette[1]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const moon=ctx.createRadialGradient(950,150,1,950,150,130);moon.addColorStop(0,'#e8dcf0a8');moon.addColorStop(1,'#e8dcf000');ctx.fillStyle=moon;ctx.fillRect(800,0,300,300);
 for(let i=0;i<34;i++){const x=((i*127-cam*.15)%(W+240)+W+240)%(W+240)-120,y=180+i%4*67,h=160+i%5*46;ctx.fillStyle=a.theme==='future'?'#273456':a.theme==='heian'?'#392a37':'#20283f';ctx.fillRect(x,y,65+(i%3)*25,h);
  if(a.theme==='city'||a.theme==='future'){ctx.fillStyle=i%3?'#9b6faa88':'#64dfea77';for(let n=0;n<5;n++)ctx.fillRect(x+7+n*13,y+16,6,8)}}
}
function drawWorld(){
 ctx.save();ctx.translate(-Math.floor(cam),0);
 const a=chapterData();ctx.fillStyle=a.theme==='future'?'#252a48':a.theme==='heian'?'#3c3037':'#333b4a';ctx.fillRect(0,G,WIDTH,H-G);
 ctx.fillStyle='#58657a';ctx.fillRect(0,G,WIDTH,6);for(let x=0;x<WIDTH;x+=64){ctx.fillStyle='#8792a541';ctx.fillRect(x,G+14,34,3)}
 const left=Math.max(0,Math.floor(cam/280)-1),right=Math.min(20,Math.ceil((cam+W)/280)+1);
 for(let i=left;i<=right;i++){
 const x=100+i*280;const theme=a.theme;
 if(theme==='heian'||theme==='temple'){
  ctx.fillStyle='#3b3240';ctx.fillRect(x-70,G-182,140,182);
  ctx.fillStyle='#76536a';poly([[x-100,G-182],[x,G-247],[x+100,G-182]],'#735263');
  ctx.fillStyle='#b58d74';for(let j=0;j<4;j++)ctx.fillRect(x-52+j*27,G-137,15,76);
 }else if(theme==='forest'){
  ctx.fillStyle='#283e45';ctx.fillRect(x-8,G-220,16,220);
  poly([[x-100,G-124],[x,G-332],[x+100,G-124]],'#355f55');
  poly([[x-79,G-184],[x,G-292],[x+78,G-184]],'#477567');
 }else if(theme==='city'||theme==='future'){
  ctx.fillStyle='#222940';ctx.fillRect(x-100,G-250,198,250);
  for(let y=G-230;y<G-25;y+=34)for(let j=0;j<5;j++){ctx.fillStyle=(i+j)%3?'#88a7cb':'#d880bb';ctx.fillRect(x-82+j*37,y,22,20)}
  if(theme==='future'){ctx.fillStyle='#6ae1e0';ctx.fillRect(x-100,G-250,198,5);ctx.fillStyle='#bfb1ff';ctx.font='15px monospace';ctx.fillText('NEO-TOKYO',x-49,G-175)}
 }else{ctx.fillStyle='#353448';ctx.fillRect(x-88,G-100,178,100);poly([[x-110,G-100],[x-20,G-172],[x+112,G-100]],'#765e71')}
 }
 for(const pl of world.platforms){if(pl.x+pl.w<cam-80||pl.x>cam+W+80)continue;ctx.fillStyle='#45455a';ctx.fillRect(pl.x,pl.y,pl.w,14);ctx.fillStyle='#958a9d';ctx.fillRect(pl.x,pl.y,pl.w,3)}

 for(const e of world.enemies){if(e.dead||e.x<cam-100||e.x>cam+W+100)continue;drawCurse(e);
 if(e.warning>0){ctx.fillStyle='#ff697b';ctx.globalAlpha=.65+.3*Math.sin(elapsed*22);ctx.fillRect(e.x-38,G-8,e.type==='boss'?178:130,8);ctx.globalAlpha=1;ctx.font='bold 11px monospace';ctx.fillStyle='#ffe2e5';ctx.fillText('INCOMING STRIKE',e.x-23,e.y-37)}if(e.type==='boss'||e.type==='elite'){ctx.fillStyle='#100f21';ctx.fillRect(e.x-10,e.y-21,e.w+20,9);ctx.fillStyle='#d36dc2';ctx.fillRect(e.x-10,e.y-21,(e.w+20)*clamp(e.hp/e.max,0,1),9);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(e.name||'ELITE CURSE',e.x+e.w/2,e.y-29)}}
 drawTaskProps();if(playing)drawPersonRefined(ctx,player.x+18,player.y+84,personFor(player.id),.65,elapsed*13*(keys.d||keys.a?1:.05));
 for(const p of world.particles){ctx.globalAlpha=clamp(p.t*2,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;

}
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function resize(){const d=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d)}
addEventListener('resize',resize);resize();
function draw(){
 const sx=cv.width/W,sy=cv.height/H;ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,W,H);

}
function loop(t){const dt=clamp((t-last)/1000||0,0,.032);last=t;try{step(dt);draw()}catch(e){console.error('VEILBOUND runtime',e);if(playing){paused=true;present('<h2>Game error</h2><p>'+esc(e.message)+'</p><button id="recover">Return to title</button>');$('recover').onclick=renderTitle}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);renderTitle();
