<div id="overlay"><div id="panel"></div></div><script>
'use strict';
const $=s=>document.querySelector(s),c=$('#world'),ctx=c.getContext('2d'),keys={},sprites={},ART={};
const CAST={yuji:{name:'Yuji Itadori',title:'THE VESSEL',color:'#ff647b',desc:'Close the distance. Chain heavy strikes into devastating Black Flashes.',skill:'Divergent Fist',ult:'Black Flash',domain:'Benevolent Boundary'},megumi:{name:'Megumi Fushiguro',title:'TEN SHADOWS',color:'#a38bff',desc:'Command Divine Dogs and call down Nue. Control the battlefield from the shadows.',skill:'Divine Dogs',ult:'Nue',domain:'Chimera Shadow Garden'},gojo:{name:'Satoru Gojo',title:'THE STRONGEST',color:'#63d6ff',desc:'Draw curses into Blue, repel them with Red, and overwhelm them with Limitless.',skill:'Lapse: Blue',ult:'Reversal: Red',domain:'Unlimited Void'}};
const ZONES=[{name:'Jujutsu High',sub:'A quiet place before the storm',x:0,end:1500,color:'#9bc3bb'},{name:'Whispering Grove',sub:'Something moves between the bamboo',x:1500,end:3100,color:'#7ae8c1'},{name:'Shibuya After Dark',sub:'The streets belong to the curses',x:3100,end:5700,color:'#ed7cb6'},{name:'The Sealed Shrine',sub:'A special grade waits beyond the gate',x:5700,end:7600,color:'#f4a079'}];
const groundY=x=>x<1500?562:x<3100?612:x<5700?562:612;
const platforms=[{x:0,y:562,w:1500,h:500},{x:1500,y:612,w:1600,h:500},{x:3100,y:562,w:2600,h:500},{x:5700,y:612,w:1900,h:500},...[ [550,435,190],[900,335,200],[1230,430,160],[1690,490,210],[2040,385,200],[2410,465,220],[2770,355,220],[3330,435,250],[3720,330,260],[4140,405,240],[4510,300,260],[4930,425,240],[5350,340,190],[5900,485,220],[6260,380,190],[6580,470,210] ].map(([x,y,w])=>({x,y,w,h:20}))];
const INITIAL=()=>({x:185,y:460,w:34,h:70,vx:0,vy:0,face:1,hp:130,ce:100,level:1,xp:0,points:0,char:'yuji',skill:true,advanced:false,domain:false,power:0,vitality:0,ground:false,jumps:0,inv:0,attack:0,combo:0,comboTimer:0,cd:0,scd:0,rcd:0,dcd:0,dash:0,dashCd:0,castTime:0,hurtTime:0,checkpoint:185,coins:0});
let p=INITIAL(),W=1280,H=720,cam=0,last=0,time=0,walking=0,paused=true,started=false,zoneIndex=0,quest=0,kills=0,bossDead=false,opened=[],effects=[],particles=[],texts=[],enemies=[],shots=[],hitStop=0,shake=0,domainTime=0,noticeTime=0,zoneTime=0,autoSave=0,saveData=null,saveOK=false,sound=true,audio=null,settings={shake:true},activeTab='techniques',tutorial=0;
const chests=[{x:970,y:335,id:0},{x:2120,y:385,id:1},{x:2820,y:355,id:2},{x:4590,y:300,id:3},{x:5430,y:340,id:4},{x:6330,y:380,id:5}];
const shrines=[{x:290,name:'School Gate'},{x:2880,name:'Grove Lantern'},{x:5480,name:'Station Lantern'}];
function resize(){W=Math.max(800,Math.round(innerWidth/innerHeight*720));c.width=W;c.height=720;ctx.imageSmoothingEnabled=false}resize();addEventListener('resize',resize);
function maxHP(){return 120+p.level*10+p.vitality*30}
function zoneAt(x){return x<1500?0:x<3100?1:x<5700?2:3}
function say(s){$('#notice').textContent=s;noticeTime=3.4}
function float(s,x,y,color='#fff'){texts.push({s,x,y,color,t:1.2})}
function tone(freq=300,duration=.08,type='sine',vol=.035){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.4),audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function burst(x,y,color,n=12,speed=180){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*speed*2,vy:(Math.random()-.6)*speed,t:.3+Math.random()*.5,color,size:2+Math.random()*3})}
function pack(){return {version:2,p:{...p,vx:0,vy:0,dash:0,inv:1},quest,kills,bossDead,opened,settings,sound}}
function validSave(s){return s&&s.version===2&&s.p&&CAST[s.p.char]&&Number.isFinite(s.p.x)&&s.p.x>=0&&s.p.x<=7600&&Number.isFinite(s.p.level)&&s.p.level>=1&&s.p.level<1000&&Array.isArray(s.opened)}
function save(manual=false){saveData=pack();try{localStorage.setItem('jjk-veilbound-v2',JSON.stringify(saveData));saveOK=true}catch{saveOK=false}if(window.parent!==window)window.parent.postMessage({type:'veilbound-save',data:saveData},'*');if(manual)say(saveOK?'Progress saved.':'Saving through loader…')}
try{const data=JSON.parse(localStorage.getItem('jjk-veilbound-v2'));if(validSave(data))saveData=data}catch{}
addEventListener('message',e=>{if(e.source!==window.parent)return;if(e.data?.type==='veilbound-save-data'&&validSave(e.data.data)){saveData=e.data.data;if(!started)title()}if(e.data?.type==='veilbound-save-result'){saveOK=!!e.data.ok;if(!saveOK)say('Browser storage is unavailable. Keep this session open.')}});
if(window.parent!==window)window.parent.postMessage({type:'veilbound-load'},'*');
function spawn(){enemies=[];for(let i=0;i<24;i++){let x=760+i*265;const type=i%5===3?'spitter':i%4===2?'brute':'crawler';const hp=type==='brute'?140:type==='spitter'?65:80;enemies.push({id:i,x,y:groundY(x)-60,w:type==='brute'?52:38,h:type==='brute'?76:48,vx:0,vy:0,hp,max:hp,type,cd:1+Math.random(),wind:0,hurt:0,stun:0,dead:false,home:x})}if(!bossDead)enemies.push({id:99,x:7010,y:502,w:100,h:110,vx:0,vy:0,hp:1350,max:1350,type:'boss',cd:1.5,wind:0,hurt:0,stun:0,dead:false,home:7010,phase:1})}
function start(char,cont=false){if(cont){if(!validSave(saveData)){say('No saved journey yet. Choose a sorcerer.');return}p={...INITIAL(),...saveData.p};quest=saveData.quest||0;kills=saveData.kills||0;opened=saveData.opened||[];bossDead=!!saveData.bossDead;settings=saveData.settings||settings;sound=saveData.sound!==false;p.hp=Math.max(1,p.hp);p.inv=2}else{p=INITIAL();p.char=char;quest=0;kills=0;opened=[];bossDead=false;tutorial=0}spawn();effects=[];shots=[];particles=[];started=true;paused=false;$('#overlay').hidden=true;$('#hud').hidden=false;$('#right').hidden=false;$('#hotbar').hidden=false;zoneIndex=zoneAt(p.x);cam=Math.max(0,p.x-W*.4);zoneTime=4;c.focus();tone(500,.2);say(cont?'Welcome back. Your journey continues.':'Talk to the instructor by the gate. Press E.');updateHUD()}
function title(){if(started)return;$('#panel').innerHTML='<div class="eyebrow">AN UNOFFICIAL JUJUTSU KAISEN FAN GAME</div><h1 class="hero-title">VEIL<span>BOUND</span></h1><p class="intro">The veil has fallen. The city is silent.<br>Choose the sorcerer who will bring it back.</p><div class="choices">'+Object.entries(CAST).map(([k,v])=>'<button class="character" data-char="'+k+'" style="--accent:'+v.color+'"><span class="char-role">'+v.title+'</span><canvas class="char-preview" width="192" height="216" data-preview="'+k+'" aria-label="'+v.name+' animated pixel character"></canvas><strong>'+v.name+'</strong><span>'+v.desc+'</span><b>Begin journey ↗</b></button>').join('')+'</div><div class="title-bottom"><button id="continue" '+(!saveData?'disabled':'')+'>Continue journey</button><span>A / D move · Space jump · J attack · Shift dash</span></div>';$('#panel').querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>start(b.dataset.char));$('#continue').onclick=()=>start('yuji',true)}
function objective(){return quest===0?'Meet the instructor at the school gate.':quest===1?'Exorcise 5 curses, then report to the instructor.':quest===2?'Travel east and investigate the sealed shrine.':quest===3?'Defeat the special-grade curse at the shrine.':'The veil is lifted. Find every hidden cache.'}
function menu(tab='techniques'){if(!started)return;paused=true;keys.a=keys.d=keys.arrowleft=keys.arrowright=false;activeTab=tab;$('#overlay').hidden=false;const cast=CAST[p.char];let content='';if(tab==='techniques')content='<p class="muted">Spend points earned by leveling up. '+p.points+' point(s) available.</p><div class="tree"><button data-buy="advanced" '+(p.advanced||p.points<1?'disabled':'')+'><small>01 · ADVANCED TECHNIQUE</small><strong>'+cast.ult+'</strong><span>'+(p.advanced?'UNLOCKED · R':'1 point · 38 cursed energy')+'</span></button><div class="connector"></div><button data-buy="domain" '+(p.domain||!p.advanced||p.points<2?'disabled':'')+'><small>02 · DOMAIN EXPANSION</small><strong>'+cast.domain+'</strong><span>'+(p.domain?'UNLOCKED · L':'2 points · requires advanced technique')+'</span></button><div class="upgrades"><button data-buy="power" '+(p.points<1||p.power>=5?'disabled':'')+'>Cursed output '+p.power+'/5<br><small>1 point · +15% damage</small></button><button data-buy="vitality" '+(p.points<1||p.vitality>=5?'disabled':'')+'>Reinforcement '+p.vitality+'/5<br><small>1 point · +30 max health</small></button></div></div>';if(tab==='journal')content='<p class="eyebrow">ACTIVE ASSIGNMENT</p><h2>'+['A new beginning','Clear the outskirts','Follow the residuals','Break the veil','Dawn beyond the veil'][quest]+'</h2><p>'+objective()+'</p><div class="journal-stats"><div><b>'+kills+'</b>Curses exorcised</div><div><b>'+opened.length+'/6</b>Hidden caches</div><div><b>'+p.coins+'</b>Cursed fragments</div></div><p class="muted">Lanterns restore health, save your progress, and become your rescue point. Press E near a lantern or cache. Hold S + Space to drop through a rooftop.</p>';if(tab==='map')content='<p class="muted">A continuous world, from the school to the eastern shrine.</p><div class="map">'+ZONES.map((z,i)=>'<div style="--accent:'+z.color+'" class="'+(i===zoneAt(p.x)?'current':'')+'"><small>0'+(i+1)+'</small><strong>'+z.name+'</strong><span>'+ (i===zon
