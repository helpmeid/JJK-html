function title(){panel.innerHTML='<div class="tag">A SIDE-SCROLLING CURSED WORLD</div><h1>VEILBOUND</h1><p>Beyond the school gates, a veil has fallen over the city. Choose your sorcerer, hunt curses, and investigate the shrine.</p><div class="choices">'+Object.keys(names).map(k=>'<button data-char="'+k+'"><img src="'+ART[k]+'" alt="">'+names[k]+'</button>').join('')+'</div><button id="continue">Continue saved game</button><p class="small">A/D move · Space jump · J strike · K technique · L domain · E talk<br>Original animated pixel characters inspired by your references · single-player fan-game prototype. Progress saves when browser storage is available.</p>';panel.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>start(b.dataset.char));panel.querySelector('#continue').onclick=()=>{if(!restore())say('No saved game yet. Choose a character.');else start(p.char,true)}}
function menu(){if(!started)return;paused=true;overlay.hidden=false;panel.innerHTML='<div class="tag">'+names[p.char]+' · LEVEL '+p.level+'</div><h1>Cursed techniques</h1><p>Technique points: '+p.points+'. Earn a point each time you level up.</p><div class="nodes"><button id="unlock" '+(p.skill||p.points<1?'disabled':'')+'>'+skillNames[p.char]+'<br><small>'+(p.skill?'Unlocked · K':'1 point · 24 energy')+'</small></button><button id="domain" '+(p.domain||!p.skill||p.points<2?'disabled':'')+'>Domain Expansion<br><small>'+(p.domain?'Unlocked · L':'Requires technique + 2 points')+'</small></button></div><p>Mission: '+objective()+'</p><button id="resume">Resume</button> <button id="save">Save progress</button><p class="small">Defeated curses stay cleared until your next session. Rest by the instructor with E. Domain costs 80 energy with a 25-second cooldown.</p>';panel.querySelector('#unlock').onclick=()=>{p.skill=true;p.points--;save();menu()};panel.querySelector('#domain').onclick=()=>{p.domain=true;p.points-=2;save();menu()};panel.querySelector('#resume').onclick=resume;panel.querySelector('#save').onclick=()=>{save();say('Save attempted. Browser storage must be enabled.')}}

function burst(x,y,color,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*250,vy:(Math.random()-.5)*250,t:.5+Math.random()*.4,color})}

function input(key,down){keys[key]=down;if(!down||paused)return;if(key==='j')hit(0);if(key==='k')hit(1);if(key==='l')hit(2);if(key==='e')interact();if((key===' '||key==='w'||key==='arrowup')&&p.ground){p.vy=-620;p.ground=false}}
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;const k=e.key.toLowerCase();if(k==='escape'){paused&&started?resume():menu();return}input(k,true)});addEventListener('keyup',e=>input(e.key.toLowerCase(),false));addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(started&&!paused)menu()});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(b.dataset.key,true)};b.onpointerup=b.onpointercancel=()=>input(b.dataset.key,false)});
function physics(o,dt){const old=o.y+o.h;o.vy+=1500*dt;o.y+=o.vy*dt;o.ground=false;for(const f of platforms){if(o.x+o.w>f.x&&o.x<f.x+f.w&&old<=f.y+2&&o.y+o.h>=f.y&&o.vy>=0){o.y=f.y-o.h;o.vy=0;o.ground=true}}}
function update(dt){time+=dt;p.cd=Math.max(0,p.cd-dt);p.scd=Math.max(0,p.scd-dt);p.dcd=Math.max(0,p.dcd-dt);p.inv-=dt;p.ce=Math.min(100,p.ce+7*dt);let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);p.vx=dir*285;p.x=Math.max(0,Math.min(7500-p.w,p.x+p.vx*dt));if(p.ground)walkDistance+=Math.abs(p.vx)*dt;if(dir)p.face=dir;physics(p,dt);if(p.y>1000)die();if(p.x>6450&&!visited){visited=true;if(quest===2){quest=3;say('The shrine is occupied. Exorcise the special grade.');save()}}if(quest===2&&visited){quest=3;save()}for(const e of enemies){if(e.dead)continue;e.cd-=dt;const dx=p.x-e.x;if(Math.abs(dx)<(e.boss?650:480))e.x+=Math.sign(dx)*(e.boss?85:65)*dt;physics(e,dt);if(Math.abs(dx)<(e.boss?95:45)&&Math.abs(p.y-e.y)<100&&e.cd<=0&&p.inv<=0){p.hp-=e.boss?28:12;p.inv=.8;e.cd=1;burst(p.x,p.y,'#ff3355',10);if(p.hp<=0)die()}}cam=Math.max(0,Math.min(7600-W,p.x-W*.4));flash=Math.max(0,flash-dt);noticeTime-=dt;if(noticeTime<0)document.querySelector('#notice').textContent='';for(const a of attacks)a.t-=dt;attacks=attacks.filter(a=>a.t>0);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);document.querySelector('#hp').style.width=Math.max(0,p.hp/(100+p.level*10)*100)+'%';document.querySelector('#energy').style.width=p.ce+'%';document.querySelector('#rank').textContent=names[p.char]+' · Lv. '+p.level;document.querySelector('#numbers').textContent=Math.ceil(p.hp)+' HP · '+Math.floor(p.ce)+' CE · '+p.xp+'/'+p.level*65+' XP';document.querySelector('#objective').textContent=objective();document.querySelector('#zone').textContent=p.x<1800?'01 / JUJUTSU HIGH':p.x<3300?'02 / BAMBOO OUTSKIRTS':p.x<5900?'03 / CITY UNDER THE VEIL':'04 / ABANDONED SHRINE'}
function die(){p.x=180;p.y=350;p.hp=100+p.level*10;p.ce=100;p.vy=0;p.inv=3;say('Rescued at the school. Your training continues.')}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,flash?'#380829':'#101326');bg.addColorStop(1,'#554255');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d8b8c5';ctx.beginPath();ctx.arc(W*.77-cam*.015,130,44,0,7);ctx.fill();for(let layer=0;layer<3;layer++){for(let i=0;i<35;i++){let x=i*230-cam*(.12+layer*.12),height=90+((i*71+layer*81)%180),y=520-height;rect(x,y,150,height+200,['#202138','#27283f','#303047'][layer]);if(layer===2)for(let j=0;j<4;j++)for(let k=0;k<4;k++)if((i+j+k)%3)rect(x+15+j*31,y+22+k*31,9,15,'#a5746a')}}ctx.save();ctx.translate(-cam,0);for(const f of platforms){rect(f.x,f.y,f.w,f.h,'#211c2b');rect(f.x,f.y,f.w,7,'#826479');rect(f.x,f.y+7,f.w,12,'#443747');for(let x=f.x;x<f.x+f.w;x+=48)rect(x,f.y+21,2,Math.min(f.h-21,100),'#372b3a')}for(let i=0;i<16;i++){let x=1600+i*90;rect(x,220+(i%3)*30,8,360,'#263e40');rect(x-35,270+(i%3)*30,80,10,'#344d49')}rect(80,400,30,170,'#7c263a');rect(480,400,30,170,'#7c263a');rect(50,395,490,22,'#a94450');rect(80,430,430,12,'#5a2133');ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('JUJUTSU HIGH',190,420);rect(6800,340,25,310,'#943249');rect(7270,340,25,310,'#943249');rect(6750,320,590,25,'#a74c57');rect(6810,370,480,14,'#662132');drawPerson(300,502,38,68,'gojo',1);ctx.fillStyle='#ffe7ac';ctx.fillText('Instructor [E]',270,488);for(const e of enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#a13262':'#6a527e';ctx.beginPath();ctx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,7);ctx.fill();rect(e.x+8,e.y+15,8,5,'#ffdbdd');rect(e.x+e.w-17,e.y+15,8,5,'#ffdbdd');rect(e.x,e.y-10,e.w,4,'#3c2233');rect(e.x,e.y-10,e.w*Math.max(0,e.hp/e.max),4,'#e84974');if(e.boss){ctx.fillStyle='#ffadb9';ctx.fillText('SPECIAL GRADE',e.x-15,e.y-22)}}if(p.inv<=0||Math.floor(time*14)%2===0)drawPerson(p.x,p.y,p.w,p.h,p.char,p.face);for(const a of attacks){ctx.strokeStyle=a.kind===0?'#ffd4dc':a.kind===1?'#7edaff':'#f48bcb';ctx.lineWidth=a.kind===0?5:10;ctx.globalAlpha=Math.min(1,a.t*5);ctx.beginPath();ctx.arc(a.x,a.y,a.kind===2?300:a.kind===1?170:65,a.dir>0?-1.1:2,a.dir>0?1.1:4.3);ctx.stroke();ctx.globalAlpha=1}for(const q of particles)rect(q.x,q.y,4,4,q.color);ctx.restore();if(flash){ctx.strokeStyle='#d566a6';ctx.lineWidth=4;ctx.strokeRect(12,12,W-24,H-24)}}
// Original 40 x 56 pixel figures. Frames are authored as articulated pixel shapes.
// References inform hair, outfit and palette only; no screenshot pixels are used.
const PALETTES={
 yuji:{hair:'#e58e9c',hairLight:'#ffb5aa',coat:'#263950',light:'#416079',skin:'#efbd9d',shoe:'#c83a53',accent:'#b9364e'},
 megumi:{hair:'#17212e',hairLight:'#304454',coat:'#202d49',light:'#405878',skin:'#e9bb9b',shoe:'#6a5646',accent:'#dfbf54'},
 gojo:{hair:'#dbe8ee',hairLight:'#ffffff',coat:'#20283c',light:'#3c5570',skin:'#efc7ad',shoe:'#151e2d',accent:'#697f9a'}
};
function makeFrame(char,state,phase=0){
 const a=document.createElement('canvas');a.width=40;a.height=56;const g=a.getContext('2d'),pal=PALETTES[char];g.imageSmoothingEnabled=false;
 const box=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)};
 const poly=(points,col)=>{g.fillStyle=col;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(Math.round(x),Math.round(y)):g.moveTo(Math.round(x),Math.round(y)));g.closePath();g.fill()};
 const moving=state==='walk',air=state==='jump',s=moving?Math.sin(phase):0,co=moving?Math.cos(phase):0,bob=moving?Math.abs(co)*1.2:0;
 const hipY=34-bob,shoulderY=23-bob;
 function limb(x,y,kx,ky,ex,ey,color,width){g.strokeStyle='#0b1220';g.lineWidth=width+2;g.lineCap='square';g.lineJoin='miter';g.beginPath();g.moveTo(Math.round(x),Math.round(y));g.lineTo(Math.round(kx),Math.round(ky));g.lineTo(Math.round(ex),Math.round(ey));g.stroke();g.strokeStyle=color;g.lineWidth=width;g.stroke()}
 // Far-side limbs, then body, then near-side limbs establish a clear profile.
 const farFoot=air?21:20-s*9,nearFoot=air?30:20+s*9;
 const farY=air?46:52-Math.max(0,co)*4,nearY=air?43:52-Math.max(0,-co)*4;
 limb(18,hipY,17-s*4,43,farFoot,farY,'#172235',5);box(farFoot-2,farY,8,3,pal.shoe);
 limb(17,shoulderY,16+s*5,30,17+s*8,36-bob,'#1a283c',4);box(16+s*8,35-bob,4,4,pal.skin);
 poly([[15,21-bob],[25,21-bob],[27,34-bob],[14,35-bob]],'#0b1220');
 box(16,22-bob,9,12,pal.coat);box(22,23-bob,3,10,pal.light);box(16,34-bob,10,3,'#101b2a');
 limb(22,hipY,23+s*4,43,nearFoot,nearY,pal.coat,5);box(nearFoot-2,nearY,9,3,pal.shoe);box(nearFoot+2,nearY,5,1,pal.light);
 // Slight forward lean while walking, compact silhouette while airborne.
 const lean=moving?1:0,hy=8-bob;
 box(15+lean,hy,12,13,'#0b1220');box(18+lean,hy+3,9,10,pal.skin);box(26+lean,hy+7,3,3,pal.skin);box(24+lean,hy+5,2,2,'#182132');
 if(char==='yuji'){
  poly([[14+lean,hy+5],[14+lean,hy-1],[17+lean,hy],[18+lean,hy-4],[21+lean,hy-1],[24+lean,hy-3],[26+lean,hy],[28+lean,hy+1],[27+lean,hy+5]],pal.hair);
  box(18+lean,hy,3,2,pal.hairLight);box(15,20-bob,12,4,pal.accent);box(14,23-bob,3,7,pal.accent);
 }else if(char==='megumi'){
  poly([[13+lean,hy+6],[14+lean,hy],[11+lean,hy-3],[17+lean,hy-2],[17+lean,hy-6],[21+lean,hy-2],[24+lean,hy-6],[25+lean,hy-1],[29+lean,hy-3],[28+lean,hy+3],[25+lean,hy+6]],pal.hair);
  box(18+lean,hy,4,2,pal.hairLight);box(15,20-bob,10,4,pal.coat);box(24,24-bob,2,2,pal.accent);
 }else{
  poly([[14+lean,hy+4],[13+lean,hy-2],[17+lean,hy-1],[17+lean,hy-5],[21+lean,hy-2],[24+lean,hy-5],[25+lean,hy-1],[29+lean,hy-2],[28+lean,hy+4]],pal.hair);
  box(18+lean,hy-1,7,2,pal.hairLight);box(15+lean,hy+5,13,4,'#101826');box(15,20-bob,12,5,pal.coat);
 }
 limb(24,shoulderY,25-s*5,29,24-s*8,air?28:35-bob,pal.light,4);box(23-s*8,air?27:34-bob,4,4,pal.skin);
 return a;
}
function drawPerson(x,y,w,h,char,face){
 const frames=sprites[char];if(!frames)return;
 const player=started&&char===p.char&&Math.abs(x-p.x)<.01&&Math.abs(y-p.y)<.01;
 const state=player&&!p.ground?'jump':player&&Math.abs(p.vx)>1?'walk':'idle';
 const index=state==='walk'?Math.floor(walkDistance/13)%8:0;
 ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(Math.round(x+w/2),Math.round(y+h));ctx.scale(face,1);
 ctx.drawImage(frames[state][index],-h*40/56/2,-h,h*40/56,h);ctx.restore();
}
async function prepareArt(){
