function say(text){document.querySelector('#notice').textContent=text;noticeTime=3.5}
function save(){try{localStorage.setItem('jjk-veilbound-v1',JSON.stringify({p,quest,kills,claimed,visited,bossDead}))}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem('jjk-veilbound-v1'));if(!s)return false;Object.assign(p,s.p);p.vx=p.vy=0;p.inv=2;p.hp=Math.max(p.hp,50);({quest,kills,claimed,visited,bossDead}=s);return true}catch{return false}}
function spawn(){enemies=[];for(let i=0;i<16;i++)enemies.push({x:800+i*390,y:0,w:38,h:48,hp:55+i*3,max:55+i*3,vy:0,cd:0,dead:false});if(!bossDead)enemies.push({x:6990,y:0,w:86,h:110,hp:650,max:650,vy:0,cd:0,boss:true,dead:false})}
function start(char,continuing=false){if(continuing&&!restore())return;if(!continuing){p.char=char}spawn();started=true;paused=false;overlay.hidden=true;last=performance.now();c.focus();say('Find the instructor at the school gate. Press E.')}
function title(){panel.innerHTML='<div class="tag">A SIDE-SCROLLING CURSED WORLD</div><h1>VEILBOUND</h1><p>Beyond the school gates, a veil has fallen over the city. Choose your sorcerer, hunt curses, and investigate the shrine.</p><div class="choices">'+Object.keys(names).map(k=>'<button data-char="'+k+'"><img src="'+ART[k]+'" alt="">'+names[k]+'</button>').join('')+'</div><button id="continue">Continue saved game</button><p class="small">A/D move · Space jump · J strike · K technique · L domain · E talk<br>Your supplied character artwork · single-player fan-game prototype. Progress saves when browser storage is available.</p>';panel.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>start(b.dataset.char));panel.querySelector('#continue').onclick=()=>{if(!restore())say('No saved game yet. Choose a character.');else start(p.char,true)}}
function menu(){if(!started)return;paused=true;overlay.hidden=false;panel.innerHTML='<div class="tag">'+names[p.char]+' · LEVEL '+p.level+'</div><h1>Cursed techniques</h1><p>Technique points: '+p.points+'. Earn a point each time you level up.</p><div class="nodes"><button id="unlock" '+(p.skill||p.points<1?'disabled':'')+'>'+skillNames[p.char]+'<br><small>'+(p.skill?'Unlocked · K':'1 point · 24 energy')+'</small></button><button id="domain" '+(p.domain||!p.skill||p.points<2?'disabled':'')+'>Domain Expansion<br><small>'+(p.domain?'Unlocked · L':'Requires technique + 2 points')+'</small></button></div><p>Mission: '+objective()+'</p><button id="resume">Resume</button> <button id="save">Save progress</button><p class="small">Defeated curses stay cleared until your next session. Rest by the instructor with E. Domain costs 80 energy with a 25-second cooldown.</p>';panel.querySelector('#unlock').onclick=()=>{p.skill=true;p.points--;save();menu()};panel.querySelector('#domain').onclick=()=>{p.domain=true;p.points-=2;save();menu()};panel.querySelector('#resume').onclick=resume;panel.querySelector('#save').onclick=()=>{save();say('Save attempted. Browser storage must be enabled.')}}
function resume(){paused=false;overlay.hidden=true;c.focus()}
document.querySelector('#menu').onclick=menu;
function objective(){return quest===0?'Talk to the instructor near the school gate [E].':quest===1?'Exorcise 5 curses ('+Math.min(kills,5)+'/5), then return to the instructor.':quest===2?'Investigate the abandoned shrine to the far east.':quest===3?'Defeat the special-grade curse at the shrine.':'Veil lifted. Explore and master your techniques.'}
function interact(){if(Math.abs(p.x-300)<150){p.hp=100+p.level*10;p.ce=100;if(!quest){quest=1;say('Mission accepted: exorcise five curses.')}else if(quest===1&&kills>=5){quest=2;reward(180);say('Mission complete. Investigate the eastern shrine.')}else say('Restored health and energy. '+(quest===1?'Defeat five curses, then return.':'The shrine lies to the east.'));save()}else say('Move closer to the instructor at the school gate.')}
function reward(x){p.xp+=x;while(p.xp>=p.level*65){p.xp-=p.level*65;p.level++;p.points++;p.hp=100+p.level*10;say('Level '+p.level+' · +1 technique point');save()}}
function burst(x,y,color,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*250,vy:(Math.random()-.5)*250,t:.5+Math.random()*.4,color})}
function hit(kind){if(paused)return;if(kind===0&&p.cd>0)return;if(kind===1&&(!p.skill||p.ce<24||p.scd>0)){if(!p.skill)say('Unlock your technique in the Techniques menu.');return}if(kind===2&&(!p.domain||p.ce<80||p.dcd>0)){say('Domain needs unlocking, 80 energy, and a ready cooldown.');return}if(kind===0)p.cd=.32;if(kind===1){p.ce-=24;p.scd=2.4}if(kind===2){p.ce-=80;p.dcd=25;flash=2;say('DOMAIN EXPANSION')}let range=kind===2?850:kind===1?420:105;attacks.push({x:p.x+p.w/2,y:p.y+30,dir:p.face,t:kind===2?1:.25,kind,range});for(const e of enemies){if(e.dead)continue;const dx=e.x-p.x;if(Math.abs(dx)<range&&(kind===2||dx*p.face>-35)&&Math.abs(e.y-p.y)<(kind===2?650:150)){e.hp-=kind===2?280:kind===1?70+p.level*5:22+p.level*4;burst(e.x+20,e.y+20,kind?'#80cfff':'#ff527d');if(e.hp<=0){e.dead=true;kills++;reward(e.boss?400:35);if(e.boss){bossDead=true;quest=4;say('SPECIAL GRADE EXORCISED · The veil has lifted.');save()}}}}}
function input(key,down){keys[key]=down;if(!down||paused)return;if(key==='j')hit(0);if(key==='k')hit(1);if(key==='l')hit(2);if(key==='e')interact();if((key===' '||key==='w'||key==='arrowup')&&p.ground){p.vy=-620;p.ground=false}}
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;const k=e.key.toLowerCase();if(k==='escape'){paused&&started?resume():menu();return}input(k,true)});addEventListener('keyup',e=>input(e.key.toLowerCase(),false));addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(started&&!paused)menu()});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input(b.dataset.key,true)};b.onpointerup=b.onpointercancel=()=>input(b.dataset.key,false)});
function physics(o,dt){const old=o.y+o.h;o.vy+=1500*dt;o.y+=o.vy*dt;o.ground=false;for(const f of platforms){if(o.x+o.w>f.x&&o.x<f.x+f.w&&old<=f.y+2&&o.y+o.h>=f.y&&o.vy>=0){o.y=f.y-o.h;o.vy=0;o.ground=true}}}
function update(dt){time+=dt;p.cd=Math.max(0,p.cd-dt);p.scd=Math.max(0,p.scd-dt);p.dcd=Math.max(0,p.dcd-dt);p.inv-=dt;p.ce=Math.min(100,p.ce+7*dt);let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);p.vx=dir*285;p.x=Math.max(0,Math.min(7500-p.w,p.x+p.vx*dt));if(dir)p.face=dir;physics(p,dt);if(p.y>1000)die();if(p.x>6450&&!visited){visited=true;if(quest===2){quest=3;say('The shrine is occupied. Exorcise the special grade.');save()}}if(quest===2&&visited){quest=3;save()}for(const e of enemies){if(e.dead)continue;e.cd-=dt;const dx=p.x-e.x;if(Math.abs(dx)<(e.boss?650:480))e.x+=Math.sign(dx)*(e.boss?85:65)*dt;physics(e,dt);if(Math.abs(dx)<(e.boss?95:45)&&Math.abs(p.y-e.y)<100&&e.cd<=0&&p.inv<=0){p.hp-=e.boss?28:12;p.inv=.8;e.cd=1;burst(p.x,p.y,'#ff3355',10);if(p.hp<=0)die()}}cam=Math.max(0,Math.min(7600-W,p.x-W*.4));flash=Math.max(0,flash-dt);noticeTime-=dt;if(noticeTime<0)document.querySelector('#notice').textContent='';for(const a of attacks)a.t-=dt;attacks=attacks.filter(a=>a.t>0);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);document.querySelector('#hp').style.width=Math.max(0,p.hp/(100+p.level*10)*100)+'%';document.querySelector('#energy').style.width=p.ce+'%';document.querySelector('#rank').textContent=names[p.char]+' · Lv. '+p.level;document.querySelector('#numbers').textContent=Math.ceil(p.hp)+' HP · '+Math.floor(p.ce)+' CE · '+p.xp+'/'+p.level*65+' XP';document.querySelector('#objective').textContent=objective();document.querySelector('#zone').textContent=p.x<1800?'01 / JUJUTSU HIGH':p.x<3300?'02 / BAMBOO OUTSKIRTS':p.x<5900?'03 / CITY UNDER THE VEIL':'04 / ABANDONED SHRINE'}
function die(){p.x=180;p.y=350;p.hp=100+p.level*10;p.ce=100;p.vy=0;p.inv=3;say('Rescued at the school. Your training continues.')}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,flash?'#380829':'#101326');bg.addColorStop(1,'#554255');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#d8b8c5';ctx.beginPath();ctx.arc(W*.77-cam*.015,130,44,0,7);ctx.fill();for(let layer=0;layer<3;layer++){for(let i=0;i<35;i++){let x=i*230-cam*(.12+layer*.12),height=90+((i*71+layer*81)%180),y=520-height;rect(x,y,150,height+200,['#202138','#27283f','#303047'][layer]);if(layer===2)for(let j=0;j<4;j++)for(let k=0;k<4;k++)if((i+j+k)%3)rect(x+15+j*31,y+22+k*31,9,15,'#a5746a')}}ctx.save();ctx.translate(-cam,0);for(const f of platforms){rect(f.x,f.y,f.w,f.h,'#211c2b');rect(f.x,f.y,f.w,7,'#826479');rect(f.x,f.y+7,f.w,12,'#443747');for(let x=f.x;x<f.x+f.w;x+=48)rect(x,f.y+21,2,Math.min(f.h-21,100),'#372b3a')}for(let i=0;i<16;i++){let x=1600+i*90;rect(x,220+(i%3)*30,8,360,'#263e40');rect(x-35,270+(i%3)*30,80,10,'#344d49')}rect(80,400,30,170,'#7c263a');rect(480,400,30,170,'#7c263a');rect(50,395,490,22,'#a94450');rect(80,430,430,12,'#5a2133');ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText('JUJUTSU HIGH',190,420);rect(6800,340,25,310,'#943249');rect(7270,340,25,310,'#943249');rect(6750,320,590,25,'#a74c57');rect(6810,370,480,14,'#662132');drawPerson(300,502,38,68,'gojo',1);ctx.fillStyle='#ffe7ac';ctx.fillText('Instructor [E]',270,488);for(const e of enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#a13262':'#6a527e';ctx.beginPath();ctx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,7);ctx.fill();rect(e.x+8,e.y+15,8,5,'#ffdbdd');rect(e.x+e.w-17,e.y+15,8,5,'#ffdbdd');rect(e.x,e.y-10,e.w,4,'#3c2233');rect(e.x,e.y-10,e.w*Math.max(0,e.hp/e.max),4,'#e84974');if(e.boss){ctx.fillStyle='#ffadb9';ctx.fillText('SPECIAL GRADE',e.x-15,e.y-22)}}if(p.inv<=0||Math.floor(time*14)%2===0)drawPerson(p.x,p.y,p.w,p.h,p.char,p.face);for(const a of attacks){ctx.strokeStyle=a.kind===0?'#ffd4dc':a.kind===1?'#7edaff':'#f48bcb';ctx.lineWidth=a.kind===0?5:10;ctx.globalAlpha=Math.min(1,a.t*5);ctx.beginPath();ctx.arc(a.x,a.y,a.kind===2?300:a.kind===1?170:65,a.dir>0?-1.1:2,a.dir>0?1.1:4.3);ctx.stroke();ctx.globalAlpha=1}for(const q of particles)rect(q.x,q.y,4,4,q.color);ctx.restore();if(flash){ctx.strokeStyle='#d566a6';ctx.lineWidth=4;ctx.strokeRect(12,12,W-24,H-24)}}
function drawPerson(x,y,w,h,char,face){const s=sprites[char];if(!s)return;ctx.save();ctx.translate(x+w/2,y+h);ctx.scale(face,1);ctx.drawImage(s,-h*.4,-h,h*.8,h);ctx.restore()}
// Treat only edge-connected gray checkerboard as screenshot background.
async function prepareArt(){for(const [key,src]of Object.entries(ART)){await new Promise(resolve=>{const img=new Image;img.onload=()=>{const a=document.createElement('canvas');a.width=img.width;a.height=img.height;const g=a.getContext('2d');g.drawImage(img,0,0);const d=g.getImageData(0,0,a.width,a.height),v=d.data,seen=new Uint8Array(a.width*a.height),queue=[];const add=(i)=>{if(i<0||i>=seen.length||seen[i])return;seen[i]=1;let z=i*4,r=v[z],b=v[z+2],gr=v[z+1];if(Math.max(r,b,gr)-Math.min(r,b,gr)<15&&r>38&&r<160){queue.push(i);v[z+3]=0}};for(let x=0;x<a.width;x++){add(x);add((a.height-1)*a.width+x)}for(let y=0;y<a.height;y++){add(y*a.width);add(y*a.width+a.width-1)}for(let j=0;j<queue.length;j++){let i=queue[j];if(i%a.width)add(i-1);if(i%a.width<a.width-1)add(i+1);add(i-a.width);add(i+a.width)}g.putImageData(d,0,0);sprites[key]=a;resolve()};img.onerror=resolve;img.src=src})}}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(!paused)update(dt);draw();requestAnimationFrame(loop)}prepareArt().then(title);requestAnimationFrame(loop);
</script></body></html>
