 ctx.fillStyle='#58657a';ctx.fillRect(0,G,WIDTH,6);for(let x=0;x<WIDTH;x+=64){ctx.fillStyle='#8792a541';ctx.fillRect(x,G+14,34,3)}
 const left=Math.max(0,Math.floor(cam/280)-1),right=Math.min(20,Math.ceil((cam+W)/280)+1);
 for(let i=left;i<=right;i++){
 const x=100+i*280;const theme=a.theme;
 if(theme==='heian'||theme==='temple'){
  ctx.fillStyle='#3b3240';ctx.fillRect(x-70,G-182,140,182);
  ctx.fillStyle='#76536a';poly([[x-100,G-182],[x,G-247],[x+100,G-182]],'#735263');
  ctx.fillStyle='#b58d74';for(let j=0;j<4;j++)ctx.fillRect(x-52+j*27,G-137,15,76);
 }else if(theme==='forest'){
  ctx.fillStyle='#283e45';ctx.fillRect(x-8,G-220,16,220);
  poly([[x-100,G-124],[x,G-332],[x+100,G-124]],'#355f55');
  poly([[x-79,G-184],[x,G-292],[x+78,G-184]],'#477567');
 }else if(theme==='city'||theme==='future'){
  ctx.fillStyle='#222940';ctx.fillRect(x-100,G-250,198,250);
  for(let y=G-230;y<G-25;y+=34)for(let j=0;j<5;j++){ctx.fillStyle=(i+j)%3?'#88a7cb':'#d880bb';ctx.fillRect(x-82+j*37,y,22,20)}
  if(theme==='future'){ctx.fillStyle='#6ae1e0';ctx.fillRect(x-100,G-250,198,5);ctx.fillStyle='#bfb1ff';ctx.font='15px monospace';ctx.fillText('NEO-TOKYO',x-49,G-175)}
 }else{ctx.fillStyle='#353448';ctx.fillRect(x-88,G-100,178,100);poly([[x-110,G-100],[x-20,G-172],[x+112,G-100]],'#765e71')}
 }
 for(const pl of world.platforms){if(pl.x+pl.w<cam-80||pl.x>cam+W+80)continue;ctx.fillStyle='#45455a';ctx.fillRect(pl.x,pl.y,pl.w,14);ctx.fillStyle='#958a9d';ctx.fillRect(pl.x,pl.y,pl.w,3)}
 for(const it of world.items)if(!it.taken){const x=it.x,y=it.y+Math.sin(elapsed*3+it.x)*5;ctx.shadowColor='#a8d9ff';ctx.shadowBlur=15;ctx.fillStyle='#a8dcff';poly([[x,y-13],[x+9,y],[x,y+13],[x-9,y]],'#9adefc');ctx.shadowBlur=0}
 for(const e of world.enemies){if(e.dead||e.x<cam-100||e.x>cam+W+100)continue;ctx.fillStyle='#302639';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle=e.type==='boss'?'#c25a84':e.type==='elite'?'#bc8bef':'#6587a2';ctx.fillRect(e.x+5,e.y+6,e.w-10,e.h-22);ctx.fillStyle='#f6a5bf';ctx.fillRect(e.x+9,e.y+13,7,5);ctx.fillRect(e.x+e.w-17,e.y+13,7,5);
 if(e.type==='boss'||e.type==='elite'){ctx.fillStyle='#100f21';ctx.fillRect(e.x-10,e.y-21,e.w+20,9);ctx.fillStyle='#d36dc2';ctx.fillRect(e.x-10,e.y-21,(e.w+20)*clamp(e.hp/e.max,0,1),9);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(e.name||'ELITE CURSE',e.x+e.w/2,e.y-29)}}
 if(playing)drawPerson(ctx,player.x+18,player.y+84,personFor(player.id),.65,elapsed*13*(keys.d||keys.a?1:.05));
 for(const p of world.particles){ctx.globalAlpha=clamp(p.t*2,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;
 if(missionType()==='explore'){ctx.fillStyle='#bffbea';ctx.font='bold 13px monospace';ctx.fillText('◆ OBJECTIVE',1700,G-95)}
 ctx.restore();
}
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function resize(){const d=window.devicePixelRatio||1;cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d)}
addEventListener('resize',resize);resize();
function draw(){
 const sx=cv.width/W,sy=cv.height/H;ctx.setTransform(sx,0,0,sy,0,0);ctx.clearRect(0,0,W,H);
 if(playing){renderBackground();drawWorld()}else{ctx.fillStyle='#0b0d1b';ctx.fillRect(0,0,W,H)}
}
function loop(t){const dt=clamp((t-last)/1000||0,0,.032);last=t;try{step(dt);draw()}catch(e){console.error('VEILBOUND runtime',e);if(playing){paused=true;present('<h2>Game error</h2><p>'+esc(e.message)+'</p><button id="recover">Return to title</button>');$('recover').onclick=renderTitle}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);renderTitle();
</script></body></html>
