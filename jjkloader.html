<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJK Loader · VEILBOUND v2.6.0</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23fc668d%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23783ef0%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a0b17%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2225%22%20fill%3D%22none%22%20stroke%3D%22url(%23a)%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M16%2017v23q0%208%209%208h3M38%2017v31h7q6%200%206-8v-3%22%20fill%3D%22none%22%20stroke%3D%22%23fff4f6%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22m13%2032%2038%200%22%20stroke%3D%22%23fc668d%22%20stroke-width%3D%223%22%2F%3E%3C%2Fsvg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#eee;font:16px system-ui,sans-serif;min-height:100vh}#screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 100%,#490b16,transparent 65%)}main{width:min(520px,100%);border:1px solid #622332;padding:40px;background:#100e15;box-shadow:0 20px 100px #0009}.eyebrow{color:#ff627a;letter-spacing:.25em;font-size:11px}h1{font-size:48px;letter-spacing:-2px;margin:12px 0}p{color:#bcb5c2;line-height:1.6;overflow-wrap:anywhere}.track{height:3px;background:#2e1b24;overflow:hidden;margin:26px 0}.track span{display:block;width:40%;height:100%;background:#e82e52;animation:load 1.3s infinite alternate}@keyframes load{to{transform:translateX(150%)}}button,a{color:#fff}button{border:1px solid #b5334d;background:#72152b;padding:12px 24px;font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}a{font-size:13px}footer{margin-top:24px;color:#837c89;font-size:12px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#09090d}#exit{position:fixed;right:12px;top:12px;z-index:5;padding:6px 10px;font-size:12px;opacity:.7} [hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.track span{animation:none;width:100%}}
#updateNotify{position:fixed;top:54px;right:16px;z-index:20;width:min(380px,calc(100vw - 32px));padding:16px 19px;background:#20182a;border:1px solid #c17de8;box-shadow:0 12px 55px #000a;border-radius:12px}#updateNotify strong{color:#ffdbf1}#updateNotify p{font-size:13px;margin:6px 0 12px}#updateNotify button{padding:8px 11px;font-size:12px;margin-right:6px}#openUpdates{position:fixed;top:13px;left:14px;z-index:19;padding:7px 12px;font-size:12px;border-radius:8px;background:#31213c}#updateModal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#080712d9}#updateCard{width:min(650px,100%);max-height:85vh;overflow:auto;background:#171223;border:1px solid #9763bb;border-radius:16px;padding:24px;box-shadow:0 15px 100px #000d}#updateCard header{display:flex;align-items:center;justify-content:space-between;gap:14px}#updateCard header h2{margin:0;font-size:26px}#updateCard article{border-top:1px solid #554364;padding:14px 0}#updateCard article h3{color:#e9bcfa;margin:0 0 7px}#updateCard article ul{color:#c9bbd8;padding-left:22px;font-size:14px;line-height:1.7}#updateCard header button{padding:7px 12px}#updateNotify[hidden],#updateModal[hidden]{display:none!important}
</style>
</head>
<body>
<section id="screen"><main>
<div class="eyebrow">JUJUTSU KAISEN · FAN GAME <span id="loaderVersion" style="float:right;color:#ffd4e1">v2.6.0</span></div>
<h1>Enter the veil.</h1>
<p id="status" role="status" aria-live="polite">Connecting to GitHub…</p>
<div class="track" id="progress"><span></span></div>
<button id="retry" hidden>Try again</button>
<footer>Source: <a href="https://github.com/helpmeid/JJK-html" target="_blank" rel="noopener noreferrer">helpmeid/JJK-html</a><br>VEILBOUND v2.6.0 · Fetches the latest game each time you open this loader.</footer>
</main></section>
<iframe id="game" title="JJK game" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen; gamepad" allowfullscreen hidden></iframe>
<button id="exit" hidden>Back to loader</button>
<button id="openUpdates" type="button" hidden>What's new</button>
<div id="updateNotify" hidden role="status" aria-live="polite"><strong id="updateHeadline">New VEILBOUND update!</strong><p id="updateSummary"></p><button id="showUpdateLog" type="button">View update log</button><button id="dismissUpdate" type="button">Dismiss</button></div>
<div id="updateModal" hidden role="dialog" aria-modal="true" aria-label="Update log"><section id="updateCard"><header><h2>VEILBOUND · Update Log</h2><button id="closeUpdates" type="button">Close</button></header><div id="updateContents"></div></section></div>
<script>
'use strict';
// Change these values if the repository or branch moves.
const UPDATE_HISTORY=[{"v":"2.6.0","title":"Extended Origin Campaigns","items":["36 campaign missions per sorcerer, 180 total.","4 new elite commanders and 4 purifiable cursed seals in each origin.","Renewable cursed encounters and required quest milestones for new abilities."]},{"v":"2.5.0","title":"Sorcerer Switching & Update Center","items":["Switch sorcerers from the roster anywhere outside a combat trial.","Each sorcerer keeps separate story progress, level, skills and location.","New update notification and changelog in the launcher and field manual."]},{"v":"2.4.0","title":"Expanded Campaign","items":["60 campaign objectives across five sorcerers.","New environmental decorations and quest journal tracker."]},{"v":"2.3.0","title":"Character Preview","items":["Higher-detail custom-character preview."]},{"v":"2.2.0","title":"Creator Expansion","items":["More markings, accessories and eye choices."]},{"v":"2.1.0","title":"Character Origins","items":["Distinct character starting areas and world themes."]},{"v":"2.0.3","title":"Story Objective Fix","items":["Restored the missing objective function."]}];
const updateNotify=document.getElementById('updateNotify');
const updateModal=document.getElementById('updateModal');
const openUpdates=document.getElementById('openUpdates');
const updateContents=document.getElementById('updateContents');
let runningVersion='';
function readSeenVersion(){try{return localStorage.getItem('veilbound-last-seen-version')}catch{return null}}
function markUpdateSeen(){if(runningVersion){try{localStorage.setItem('veilbound-last-seen-version',runningVersion)}catch{}}updateNotify.hidden=true}
function openUpdateLog(){
 updateContents.replaceChildren();
 for(const u of UPDATE_HISTORY){
  const article=document.createElement('article'),heading=document.createElement('h3'),list=document.createElement('ul');
  heading.textContent='v'+u.v+' · '+u.title;
  for(const item of u.items){const li=document.createElement('li');li.textContent=item;list.append(li)}
  article.append(heading,list);updateContents.append(article);
 }
 updateModal.hidden=false;markUpdateSeen();
}
document.getElementById('showUpdateLog').onclick=openUpdateLog;
openUpdates.onclick=openUpdateLog;
document.getElementById('dismissUpdate').onclick=markUpdateSeen;
document.getElementById('closeUpdates').onclick=()=>updateModal.hidden=true;
updateModal.addEventListener('click',event=>{if(event.target===updateModal)updateModal.hidden=true});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!updateModal.hidden){updateModal.hidden=true}});
function announceVersion(gameVersion){
 runningVersion=gameVersion;
 openUpdates.hidden=false;
 const last=readSeenVersion();
 if(last===gameVersion){updateNotify.hidden=true;return}
 const details=UPDATE_HISTORY.find(u=>'v'+u.v===gameVersion);
 document.getElementById('updateHeadline').textContent=last?'New update available · '+gameVersion:'Welcome to VEILBOUND · '+gameVersion;
 document.getElementById('updateSummary').textContent=details?details.title+' — '+details.items[0]:'See what changed in the latest game version.';
 updateNotify.hidden=false;
}
const CONFIG={owner:'helpmeid',repo:'JJK-html',branch:'main',files:['game.html','index.html']};
const statusEl=document.getElementById('status'),progress=document.getElementById('progress'),retry=document.getElementById('retry'),frame=document.getElementById('game'),screenEl=document.getElementById('screen'),exit=document.getElementById('exit');
let running=false;
async function fetchText(url,optional=false){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});
 if(optional&&response.status===404)return null;
 if(!response.ok)throw new Error('GitHub returned '+response.status+'. Check that the repository and branch are public and available.');
 return await response.text();
 }finally{clearTimeout(timer)}
}
async function load(){
 if(running)return;running=true;retry.hidden=true;progress.hidden=false;statusEl.textContent='Fetching the latest game from GitHub…';
 try{
 const root='https://raw.githubusercontent.com/'+encodeURIComponent(CONFIG.owner)+'/'+encodeURIComponent(CONFIG.repo)+'/'+encodeURIComponent(CONFIG.branch)+'/';
 let html=null,path='';
 for(const candidate of CONFIG.files){const result=await fetchText(root+candidate+'?t='+Date.now(),true);if(result!==null){html=result;path=candidate;break}}
 if(html===null)throw new Error('No game found yet. Add game.html or index.html to the main branch of '+CONFIG.owner+'/'+CONFIG.repo+'. Keep this loader named loader.html.');
 if(html.includes('const CONFIG={owner:')&&html.includes('Enter the veil.'))throw new Error('The repository contains the loader instead of the game. Add the actual game as game.html.');
 const doc=new DOMParser().parseFromString(html,'text/html');
 doc.querySelectorAll('base').forEach(el=>el.remove());
 const base=doc.createElement('base');base.href=new URL('.',root+path).href;doc.head.prepend(base);
 // Inline ordinary external scripts/styles so raw GitHub MIME types do not block them.
 // Module-based builds should be hosted with GitHub Pages instead.
 for(const link of [...doc.querySelectorAll('link[rel="stylesheet"][href]')]){
 const url=new URL(link.getAttribute('href'),base.href);if(!['https:','http:'].includes(url.protocol))continue;
 const css=await fetchText(url.href);const style=doc.createElement('style');
 style.textContent=css.replace(/url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/g,(match,quote,value)=>value.startsWith('data:')||value.startsWith('#')?match:'url("'+new URL(value,url).href+'")');link.replaceWith(style);
 }
 for(const script of [...doc.querySelectorAll('script[src]')]){
 if(script.type==='module')throw new Error('This game uses JavaScript modules. Use a single-file HTML game or host its build with GitHub Pages.');
 const url=new URL(script.getAttribute('src'),base.href);if(!['https:','http:'].includes(url.protocol))throw new Error('Unsupported script source.');
 script.textContent=await fetchText(url.href);script.removeAttribute('src');script.removeAttribute('integrity');script.removeAttribute('crossorigin');
 }
 const gameVersion=doc.querySelector('#versionBadge span')?.textContent?.trim()||doc.title.match(/v\d+\.\d+\.\d+/)?.[0]||'unknown';announceVersion(gameVersion);document.getElementById('loaderVersion').textContent=gameVersion;document.title='JJK Loader · VEILBOUND '+gameVersion;statusEl.textContent='Starting '+path+' · '+gameVersion+'…';
 frame.onload=()=>{screenEl.hidden=true;frame.hidden=false;exit.hidden=false;frame.focus()};
 frame.srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;
 }catch(error){progress.hidden=true;retry.hidden=false;statusEl.textContent=error.name==='AbortError'?'The connection timed out. Check your internet connection and try again.':error.message}
 finally{running=false}
}
// The sandboxed game cannot access browser storage directly. Keep a narrow,
// game-specific bridge here so saves survive loader reloads without relaxing it.
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||!event.data)return;
 if(event.data.type==='veilbound-load'){
  let data=null;try{data=JSON.parse(localStorage.getItem('jjk-veilbound-v2'))}catch{}
  frame.contentWindow.postMessage({type:'veilbound-save-data',data},'*');
 }
 if(event.data.type==='veilbound-save'){
  let ok=false;try{const data=event.data.data;const value=JSON.stringify(data);
   if(data?.version===2&&data.p&&value.length<50000){localStorage.setItem('jjk-veilbound-v2',value);ok=true}
  }catch{}
  frame.contentWindow.postMessage({type:'veilbound-save-result',ok},'*');
 }
});
retry.addEventListener('click',load);
exit.addEventListener('click',()=>{frame.onload=null;frame.removeAttribute('srcdoc');frame.hidden=true;exit.hidden=true;screenEl.hidden=false;statusEl.textContent='Game closed. Fetch the latest version to play again.';progress.hidden=true;retry.hidden=false;retry.textContent='Load game'});
load();
</script>
</body>
</html>
